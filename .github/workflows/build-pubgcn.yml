name: Build PUBG CN flavor

# Standalone CI build for the pubgcn flavor: same reusable _build.yml pipeline
# (native libs, assets, caches) but a single flavor whose applicationId is
# com.tencent.tmgp.pubgmhd. Artifact: Bannerlator-<number>-pubgcn.apk

on:
  workflow_dispatch:
    inputs:
      release_number:
        description: 'Label for APK file names'
        required: true
        default: 'pubgcn'
  push:
    branches: [main]
    paths:
      - 'app/build.gradle'
      - '.github/workflows/_build.yml'
      - '.github/workflows/build-pubgcn.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'pubgcn-main' || format('pubgcn-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      release_number: ${{ inputs.release_number || 'pubgcn' }}
      flavors: '[{"id":"pubgcn","task":"assemblePubgcnRelease"}]'
